# Admin_weibo - every setting a run can be pointed at.
#
# This file is read by org.sengmean.config.ConfigDataProvider at the start of a run. It is
# committed, so what is here is the answer for an ordinary run against the usual admin
# environment with the usual operator account.
#
# ANYTHING HERE CAN BE OVERRIDDEN FOR ONE RUN, AND THE ORDER IS
#
#   1. -Dkey=value on the command line        ./mvnw test -Dheadless=false
#   2. the environment variable               BASE_URL=... ./mvnw test
#      (the same name, upper case, dots as underscores: base.url -> BASE_URL)
#   3. Config/secrets.properties              not committed - see secrets.properties.example
#   4. this file
#
# So a CI job can pass credentials as environment variables without them appearing in a
# command line that gets logged, and a developer can flip one value without editing anything.
#
# Settings deliberately do NOT live in the POM. Surefire plants a literal from
# <systemPropertyVariables> into the forked JVM after Maven has read the command line, so a
# value set there looks like a default and is not one - a -D override is silently ignored.

# --- The environment under test ---

# The Weibo Empire admin back office under test. Every page object navigates relative to it.
#
# An origin with no path and no query string. A base of ".../en?x=1" produces
# ".../en?x=1/admin/member/" - the path lands inside the query string and every navigation
# silently goes to the wrong page. Use base.query below for parameters.
base.url=https://admin-test.138hk.vip/

# Appended to every navigation as a real query string, without the leading "?".
base.query=

# --- The account the suites sign in as ---

# The back-office operator account the suites sign in as (Super Admin on admin-test).
test.username=qa0001
test.password=password1@

# The captcha the test environment accepts for every form. A real one is not issued here.
test.captcha=1111

# A second operator account, for anything the shared one cannot serve - a lock-out case, or a
# case that needs a role with fewer permissions than the usual one.
test.alt.username=
test.alt.password=

# --- The other roles, for the Access Control cases (RBMP-115..119) ---
#
# An Admin, an Agent and an ordinary member account. These cases are about what a role may NOT
# do - the Agent must not find Rebate management in the menu, the member must not reach
# /rebate/set-up by typing it - and there is no way to ask the back office to pretend, so each
# needs a session that really holds that role. While a pair is blank its case reports Not run
# and names the key, rather than passing on a control that was never there to be found.
#
# Passwords belong in Config/secrets.properties (not committed) or in the environment; the
# usernames are harmless here.
test.admin.username=qa0001
test.admin.password=password123@
test.agent.username=qatest
test.agent.password=password123@
# qatest is an Agent (confirmed by Si, 2026-09-25), so it cannot stand in for an ordinary user.
# This is the member-site QA account NewWeibo_automation signs in with. The back office refuses it
# at sign-in ("Wrong username/password") - member and back-office accounts are separate - and that
# refusal is what the ordinary-user rows record as the member being kept out.
#
# Carried over unverified from Admin_weibo's own test.user.* (NewWeibo_automation's account, on
# 1083.city) when this project was cloned. Tried live against Quark's own member site
# (test-v2.138hk.vip) 2026-10-24: refused with "Wrong username/password, please re-enter." - this
# account does not exist there, or this is not its password. A browser on this machine already has
# a saved session for qa00002 (note: one fewer zero than the account below) on that site, which is
# very likely the real Quark QA member account - correct username and password here once confirmed,
# not in the page object.
test.user.username=qa000092
test.user.password=password

# --- The language the whole run happens in ---
#
# The back office offers three, and the value here is the option value its own selector uses,
# not the word it displays:
#
#   en      English
#   zh-TW   Chinese   (Taiwan Chinese - NOT "zh")
#   th      Thai
#
# Every signed-in suite switches the header to this before its first case, so a run is entirely
# in one language rather than in whatever the last person left the account on. Flip it for one
# run without editing anything:
#
#   ./mvnw test -Dsuite=RebateSuite -Dtest.language=zh-TW
#
# The localization cases (RBMP-120..123, RBMP-131, RBMP-133) are the exception and are meant to
# be: they switch language themselves because that is what they are testing, and they put this
# language back afterwards.
#
# A caution before setting th: the suite only carries VERIFIED wording for en and zh-TW, because
# those are the two that have been read off the running screen. Under Thai, any case that
# asserts visible text falls back to a structural check and says so in the report - see
# RebateTestData.hasExpectationsFor.
test.language=en

# --- The currency the whole run happens in ---
#
# The back office offers Fiat Currency / USDT / TRX / THB / HKD / USD, and the value here is the
# selector's own option value.
#
# This is NOT a display filter, and that is the thing to know before changing it: Rebate set up
# keeps a SEPARATE set of global settings and a SEPARATE list of programs PER CURRENCY. Measured
# 2026-09-18, the Real-time panel held Min. Claim 0.05 under USDT and 19 under HKD, and each
# currency listed different programs. So this key decides which records the entire run reads and
# writes - a suite pointed at the wrong one will report an empty tab on an environment that has
# data, and will write its changes somewhere nobody is looking.
#
#   ./mvnw test -Dsuite=RebateSuite -Dtest.currency=USDT
#
# HKD by default, for three reasons, and the third is the one that changed recently:
#
#   1. HKD IS THE CURRENCY THE PROJECT'S CASES ARE WRITTEN AGAINST. It is what the client's
#      captures show and where every expected value in the suite was read from.
#
#   2. HKD IS WHERE THE SETTLEMENT LEDGER HAS RECORDS. The A8 rows - RBMP-050 to RBMP-055 - read
#      the Rebate report, because settlement itself has no admin control. Measured 2026-09-21,
#      HKD holds four settled Real-time records and THB holds none, so all six of those rows
#      abort on an empty currency and run on this one.
#
#   3. THE SUITE CAN CREATE HERE AGAIN. This key was briefly set to THB, and the reason is worth
#      understanding because it is gone rather than forgotten: /api/account/agent and
#      /api/account/member_group used to answer "Permission denied" for the operator in
#      test.username, so the Create form's two group pickers rendered EMPTY and every program the
#      suite could make was targeted at the form's "Select all" default - All Agents / All
#      Groups, one pairing, which the back office treats as colliding with every program on the
#      tab. On a currency with hand-seeded data the suite could therefore create nothing: on HKD
#      55 rows passed and 59 reported Not run, against 72 and 42 on an empty THB.
#
#      That permission has been granted. The pickers offer 218 Agent groups and 5 Member groups
#      (measured 2026-09-21), so the suite picks pairings of its own and coexists with whatever
#      is already there. The reason to prefer an empty currency has gone with it.
test.currency=HKD

# --- Which currency the Web content management seed suites touch ---
#
# MemberBenefitsSeedData and ShareLinkSeedData seed (and delete) their ten records under EVERY
# currency the header offers by default, because both features keep records per currency the
# same way Rebate set up does - a seed written for one currency only leaves every other
# currency's pagination rows just as starved as before.
#
# Blank here means "every currency". Set this to one of the values test.currency above lists
# (Fiat Currency / USDT / TRX / THB / HKD / USD) to seed or delete in just that one instead -
# useful for a quick check, or to fix up a single currency without touching the others:
#
#   ./mvnw test -Dsuite=MemberBenefitsSeedSuite -Dseed.currency=HKD
#   ./mvnw test -Dsuite=ShareLinkSeedCleanupSuite -Dseed.currency=HKD
#
# A value the header does not offer fails immediately, naming what it does offer, rather than
# quietly seeding nothing.
seed.currency=

# --- The Agent group and Member group a created program is targeted at ---
#
# RBMP-011 and RBMP-065 create a program aimed at ONE Agent group and ONE Member group, rather
# than leaving the form on its "Select all" default. These are the names as the Create form's
# pickers display them - change them here when the environment's groups change, rather than
# editing a case.
#
# They are used when the pickers offer them, which since 2026-09-21 they do: /api/account/agent
# and /api/account/member_group used to answer "Permission denied" for this operator and both
# panes rendered empty, and that permission has been granted.
#
# The fallback is kept for the day it is revoked, or for an environment where these two names do
# not exist: the row then uses the form's default targeting, still creates the program, and
# records in the report that the named pairing could not be exercised. It does not abort - a
# create that used the default is still a create, and reporting Not run would lose the coverage
# the form CAN give.
#
# Kuake (admin-test.138hk.vip): neither agent-8001 nor "Default 00" is offered (confirmed on the
# live Rebate set up > Create form, 2026-10-21) - same gap as Notification's. Verified kktest /
# group test exist in both pickers and, test-submitted on the live Daily rebate tab, saves cleanly
# with no pairing conflict (created then deleted - "QA Pairing Probe - DELETE ME").
#
# Real-time rebate is a different story: the SAME pairing submitted on the Real-time tab was
# refused - "kktest and group test already exist in 'WIN WIN CITY GAME 50%'" - because that one
# live program is set to All Agents / All Groups, which collides with every possible specific
# pairing, not just this one. There is no fixture pairing that avoids this; it blocks every
# Real-time create-with-a-specific-pairing row until that program is disabled/narrowed or the
# suite is taught to treat a collision as the same "fall back to default targeting" case it
# already has for a missing group name (it currently does not - a collision on submit is a new
# failure shape, not the "group not offered" one these rows were written to tolerate). Flagging
# rather than silently coding around it.
test.group.agent.name=kktest
test.group.member.name=group test

# --- The group ids the suite pairs its seeded programs with ---
#
# The rows about duplicate pairings need TWO programs whose Agent/Member group pairings differ.
# The Create form could not express a specific pairing for this operator - its two pickers
# answered "Permission denied", so the only pairing it could offer was All Agents / All Groups -
# and the suite seeded those fixtures through the API instead; see
# src/test/java/org/sengmean/support/RebateProgramApi.java for why, and for what that does and
# does not prove.
#
# THAT IS NO LONGER THE ONLY WAY. The permission was granted on 2026-09-21 and the pickers now
# offer 218 Agent groups, so RBMP-016, RBMP-024 and RBMP-039 find their own free pairings through
# the form - by creating a program, seeing whether the back office takes it, and deleting it
# again, which is the only authority on whether a pairing is free. The keys below stay for the
# API seeding path, which has not been retired.
#
# These are the numeric ids the back office uses, not the names it displays. They were read off
# the programs the environment already holds (2026-09-21), and verified by creating with them:
#
#   31 -> agents002     12 -> testing
#   27 -> agent-8001     9 -> Default 00
#
# If the environment is rebuilt these will change. A wrong id is not silent: the API answers
# "Verification wrong" and the case reports it.
#
# With the pickers answering, a run does not need these at all unless it takes the API path.
# They are still correct, and still the fastest way to seed a specific pairing without a browser.
test.pairing.agent.id=31
test.pairing.group.id=12
test.pairing.alt.agent.id=27
test.pairing.alt.group.id=9

# --- Product > Other Category (OC-*) ---
#
# Where the back office serves the Other Category list, relative to base.url.
#
# NOT YET CONFIRMED. The feature had not been deployed when OtherCategoryTest was written
# (2026-09-23): the side navigation offered no Product menu and this path rendered the shell
# with an empty content area. The value is the one the "Product > Other Category" menu path
# implies. The suite follows the menu entry when one is offered and falls back to this path,
# so correct it here - not in the page object - if the real screen turns up somewhere else.
test.otherCategory.path=product/other-category

# --- Tool > Notification (NOT-*) ---
#
# Where the back office serves the Notification list, relative to base.url. Confirmed 2026-09-28
# against the shipped screen: the Tool > Notification menu entry links to /tools/notification
# (plural "tools"), and the Add / Edit form is /tools/notification-form[?id=N].
test.notification.path=tools/notification

# --- Tool > SMS Sending Log (SMS-ADM-*, SMS-CLI-*, SMS-NFR-*) ---
#
# Where the back office is expected to serve SMS Sending Log, relative to base.url. Not yet
# confirmed - measured live 2026-10-21, Tool offers only Notification; no SMS Sending Log entry.
# The default follows Notification's own /tools/<name> addressing - correct it here once the
# screen ships, not in the page object.
test.smsSendingLog.path=tools/sms-sending-log

# --- Web content management > Quick Tour Banner (QT-A-*) ---
#
# Where the back office serves Quick Tour Banner, relative to base.url. Confirmed live 2026-10-24
# (the guessed /cms/<kebab-name> addressing was right); see QuickTourBannerListPage's javadoc.
test.quickTour.path=cms/quick-tour-banner

# The groups the suite's notifications target, so they reach the member in test.user.* and the
# Message Center rows (NOT-CLI-*) have something to read. Both must be groups that member belongs
# to - confirm them in Agent management / Member Management before the first client run.
# Kuake (admin-test.138hk.vip), measured 2026-10-21 on the live Add Notification form: neither of
# Admin_weibo's values exists here. agents001 is not offered - the Agent Group picker's 76 entries
# are agent8001, 9000, ttt1903, subttt, ... kktest, kktest1-3, ... ts2022, daily01 (NotificationSeed
# failed on this, see NotificationSeed-test-report.html). "Default 00" is not offered either - the
# Member group picker offers Default, group test, hooo, rqrqr, A-I, daily50-54. Picked the two that
# read as deliberate QA fixtures rather than live groups; confirm test.user.* actually belongs to
# "group test" before trusting NOT-CLI-* (unverified here - this login only reached the form, not
# a member account's own group membership).
test.notification.agentGroup=kktest
test.notification.memberGroup=group test

# A member OUTSIDE those groups, for NOT-CLI-009 (a targeted notification must not reach them).
# Si, 2026-09-30: qa000096 - it is in the HKD Member Group "QA Test Group 096", not Default 00.
# Blank these and the row reports Not run naming the keys.
test.notification.outsider.username=qa000096
test.notification.outsider.password=password

# How long a Message Center row waits for a pushed notification to arrive before deciding it has
# not. Delivery is queued: the 2026-09-30 11:48 run showed rules fired at 11:00:00 landing in the
# inbox at 11:00:41, while the suite read the inbox seconds after Send Now and saw nothing.
client.messages.deliveryWaitSeconds=150

# The schedule rows (a Daily/Weekly notification actually firing at its Timer) can only be decided
# by waiting for the next whole hour. Off by default, so an ordinary run never sits for an hour;
# those rows report Not run naming this key. Turn it on for a run that may wait up to this long.
test.notification.waitForSchedule=false
test.notification.maxScheduleWaitMinutes=65

# The Pending and Failed rows (NOT-RHD-006, NOT-RHL-007) need a send that does not resolve at once, which
# the suite cannot cause: Record History on admin-test has only ever held Sent entries. Si's way (2026-10-01):
# a developer-assisted run. The developer STOPS the delivery process, this key is turned on, the row clicks
# Send Now and reads the entry while it is Pending; then the developer resumes the process (NOT-RHD-006
# expects Sent) or makes the queued delivery fail (NOT-RHL-007 expects Failed), and the row waits up to
# resolveWaitMinutes for the entry to leave Pending. Off by default: the rows then look for an existing
# Pending or Failed entry and report Not run naming this key when there is none.
test.notification.deliveryStopped=false
test.notification.resolveWaitMinutes=10

# The member site's Message Center, relative to client.url. Until the designed screen ships this is
# the developer integration page "Message Center (联调)", reachable only by address once signed in
# (confirmed 2026-09-29). Point it at the real route when that ships.
client.messages.path=en/inbox-test/
# The language the page renders titles and content in (its 语言 select starts at zh-TW). The suite
# names its notifications in English, so keep en unless a case reads another language.
client.messages.language=en

# The client platform (member site) the OC-CLI-* and OC-I18N-003/004 rows read the category
# from. The same origin NewWeibo_automation tests. An origin, with no path.
client.url=https://test-v2.138hk.vip

# --- Browser window ---

# true runs Chromium without a visible window, false shows it.
# A single run can be flipped without editing this file:
#   ./mvnw test -Dheadless=false
headless=false

# Milliseconds to pause between Playwright actions. 0 for a real run; 500-1000 makes a headed
# run followable when you are debugging a locator.
slowMo=0

# --- How long the suites wait for the site to settle ---
#
# These are not element waits - Playwright does those itself. They are the pauses after an
# action that makes the whole page re-render, where there is nothing specific to wait for.
# Raise them when the test environment is having a slow day rather than editing a suite.

# After a fresh sign-in, before the first case runs.
test.login.settle=3000

# How long any single action - a click, a fill, waiting for an element - may take.
# Raised from 6000 on 2026-09-30 (Si): the Localization suite's interface-language switches re-render
# the whole screen, and six seconds was not always enough for a control to come back.
test.actionTimeout=10000

# How long a navigation may take, which is a different question from how long a click may take.
test.navigationTimeout=30000

# How long BasePage.awaitReady lets `load` run over before carrying on regardless.
test.settleAfterReady=5000

# --- Where the run writes what it produces ---
#
# All of these are outputs, all rebuilt on every run, and none normally needs changing. They
# are listed because a reader looking for "where did the report go" should find the answer in
# this file rather than by grepping the generators.

report.out.dir=docs/reports
report.extent.dir=docs/reports/extent
report.cases.out=docs/test-cases/index.html
report.results.dir=docs/reports/cases
report.src=src/test/java/org/sengmean/tests
report.shots=target/case-screenshots
report.logs=target/case-logs
report.in=target/surefire-reports

# The per-case launchers under TestCase/run, regenerated at the end of every run from the ids
# the sources carry - so a case added or renamed today cannot leave yesterday's .cmd behind.
# Set to false on a machine where writing them is not wanted; nothing else depends on them.
testcase.run.enabled=true
testcase.run.dir=TestCase/run

# --- Emailing the report when a run finishes ---
#
# Off by default, because a suite that mails somebody on every local run is a suite people turn
# off entirely. Switch it on for CI, or for a run whose result is going to someone.
#
# The password is NOT in this file. It is read, in order, from -Dmail.password, from the
# MAIL_PASSWORD environment variable, or from Config/secrets.properties - see
# secrets.properties.example for how to get one.
mail.enabled=false
mail.smtp.host=smtp.gmail.com
mail.smtp.port=465
mail.smtp.auth=true
mail.from=
mail.to=

# --- The Swagger UI app (org.sengmean.api.ApiDocsApplication) ---
#
# Independent of the suites; `./mvnw test` never starts a Spring context. Note that
# spring-boot:run forks a JVM that does not inherit Maven's -D properties, so override these
# with environment variables - API_DOCS_USER, API_DOCS_PASSWORD - rather than on the command
# line. Local development credentials for a localhost documentation app, not a secret.
#
# 8081 rather than 8080, so this project's docs app and NewWeibo_automation's can both be up
# on this machine at once.
api.docs.port=8081
api.docs.user=qa
api.docs.password=qa0000

# --- The client platform's NEW UI, on the HK brand (UiOtherCategoryClientHK) ---
# A second member site, running the "new" UI version that renders Other Categories as home-page
# sections (test-v2.1083.city runs the old UI, which lists none). A fresh visitor is asked
# "No UI version - Old UI / New UI"; the rows answer New UI. The member account below is the
# testing account Si gave on 2026-10-02 for that site; the verification code is accepted as 1111.
client.hk.url=https://test-v2.138hk.vip
client.hk.username=qa00001
client.hk.password=password
client.hk.captcha=1111

# A second HK-brand account, with messages of its own, for NOT-CLI-035: whether a signed-in
# member can reach another member's message by its own address. Blank until Si gives one; the
# row aborts naming this key while it is.
client.hk.outsider.username=
client.hk.outsider.password=

