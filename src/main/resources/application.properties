# Configuration for the Swagger UI app (org.sengmean.api.ApiDocsApplication).
# It has no effect on `mvn test` - the Playwright suites never start a Spring context.

spring.application.name=admin-weibo-api-docs

# 8081 rather than 8080, so this docs app and the sibling NewWeibo_automation one can both
# be up on this machine at once. Config/config.properties carries the same default.
server.port=${api.docs.port:8081}

# Swagger UI at the conventional path as well as springdoc's default /swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# One definition: this app's own generated one. NewWeibo_automation additionally serves a
# hand-written spec for its system under test, and lists both here with springdoc.swagger-ui
# .urls[]. Do the same when a spec for the admin back office exists - note that listing
# urls[] REPLACES the default single-definition view, so the generated one has to be named
# explicitly or it disappears from the drop-down.

# Keep operations in the order they are declared rather than alphabetically.
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# HTTP Basic credentials for this docs app (see org.sengmean.api.ApiDocsSecurityConfig).
# Spring Boot's single in-memory user - there is no user store and no registration.
#
# The defaults below are local development credentials for a localhost documentation app,
# not a secret. Override them per run instead of editing them here; the environment
# variables are the reliable route, because spring-boot:run forks a JVM that does not
# inherit Maven's -D properties:
#
#   API_DOCS_USER=... API_DOCS_PASSWORD=... mvn spring-boot:run
#
# Leaving spring.security.user.password unset instead would make Spring Boot generate a
# random password and print it at startup, which is safer but has to be copied out of the
# console on every run.
spring.security.user.name=${api.docs.user:qa}
spring.security.user.password=${api.docs.password:qa0000}
