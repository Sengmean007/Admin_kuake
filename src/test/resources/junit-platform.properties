# How every suite in this project orders its cases.
#
# Without these, JUnit picks a deterministic but arbitrary order, and that is not the same thing as
# a sensible one. It bit this project for real: in ManualTransferTest the sweep case ran before the
# case that funds the game wallets, so TFX-001 found everything empty and skipped, and
# TPTRANSFER-0013 had nothing to transfer back. Both looked like environment problems for a while.
#
# testmethod.order.default = DisplayName
#   Every display name in this project begins with the case id - HKDTRANSFER-001, HKDDEPO-0068,
#   WDX-005 - so ordering by display name makes a suite run, and its report page read, in id order.
#   That is the order a reader tracing rows back to the client workbook expects. It is lexicographic
#   rather than numeric, so a padded id sorts before a shorter one (HKDTRANSFER-0011 before -005);
#   that is a wart of the workbook's own inconsistent padding, not of the ordering.
#
# testclass.order.default = OrderAnnotation
#   Nested groups carry @Order in their source order, which is the order their author meant them to
#   be read in. A group without @Order sorts last rather than randomly.
#
# A class that needs something else says so locally and wins: ManualTransferTest.ValidTransfers
# declares @TestMethodOrder(MethodOrderer.OrderAnnotation.class) because its cases follow the money
# - fund every game, move some back, ask for too much, sweep it all home - which is not id order.
junit.jupiter.testmethod.order.default = org.junit.jupiter.api.MethodOrderer$DisplayName
junit.jupiter.testclass.order.default = org.junit.jupiter.api.ClassOrderer$OrderAnnotation
